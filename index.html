<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>応募企業一覧</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    h1 {
      border-left: 6px solid #0078ff;
      padding-left: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #0078ff;
      color: #fff;
    }
    a {
      color: #0078ff;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .add-btn {
      background: #0078ff;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>応募企業一覧</h1>

  <a href="add.html" class="add-btn">企業を追加する</a>

  <table id="companyTable">
    <thead>
      <tr>
        <th>企業名</th>
        <th>応募サイト</th>
        <th>書類選考</th>
        <th>一次面接</th>
        <th>二次面接</th>
        <th>合否</th>
        <th>編集</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="main.js"></script>

</body>
</html>
